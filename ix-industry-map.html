<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="0.1.20">
<title>Dutch IX Industry Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'GT America Medium';
    src: url('https://www.ciiic.nl/_nuxt/GT-America-Extended-Medium.BqJJQ_OL.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ciiic-lime: #C8E641;
    --ciiic-black: #000000;
    --text-primary: #FFFFFF;
    --text-muted: #AAAAAA;
    --border-subtle: rgba(255, 255, 255, 0.1);
    --radius: 0.5rem;
    --radius-sm: 0.375rem;
    --font-heading: 'GT America Medium', 'Inter', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --vertical-count: 3;
  }

  body {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-primary);
    background: var(--ciiic-black);
    min-height: 100vh;
    padding: 2.5rem 1rem 3rem;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    max-width: 81rem;
    margin: 0 auto;
    min-height: calc(100vh - 5rem);
    display: flex;
    flex-direction: column;
  }

  header {
    margin-bottom: 1.25rem;
    text-align: center;
  }

  header h1 {
    font-family: var(--font-heading);
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.1;
    color: var(--text-primary);
    max-width: 48rem;
    margin: 0 auto;
  }

  header .subheader {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-top: 0.75rem;
    letter-spacing: 0.01em;
    max-width: 40rem;
    margin-left: auto;
    margin-right: auto;
  }
  header .subheader:empty { display: none; }

  header .intro {
    font-family: var(--font-body);
    font-size: 0.9375rem;
    color: var(--text-primary);
    margin-top: 0.625rem;
    line-height: 1.6;
    max-width: 39rem;
    margin-left: auto;
    margin-right: auto;
  }
  header .intro:empty { display: none; }

  header .intro-version {
    color: var(--text-muted);
  }

  .page-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    margin-top: auto;
    padding-top: 2rem;
    flex-wrap: wrap;
  }

  .badge {
    font-family: var(--font-body);
    font-size: 0.6875rem;
    font-weight: 500;
    padding: 0.35rem 0.75rem;
    border-radius: 9999px;
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
  }

  .matrix {
    background: var(--ciiic-black);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .layer-block { border-bottom: 1px solid var(--border-subtle); }
  .layer-block:last-child { border-bottom: none; }

  .layer-band {
    padding: 0.875rem 1.25rem;
    font-family: var(--font-heading);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .layer-grid {
    display: grid;
    grid-template-columns: repeat(var(--vertical-count), 1fr);
  }

  .vertical-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border-subtle);
  }
  .vertical-column:last-child { border-right: none; }

  .col-head {
    padding: 0.875rem 1rem;
    font-family: var(--font-heading);
    font-size: 0.6875rem;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .col-head .tip-icon,
  .layer-band .tip-icon {
    border-color: rgba(255, 255, 255, 0.4);
    color: rgba(255, 255, 255, 0.85);
  }

  .cell {
    padding: 0.875rem 1rem;
    min-height: 52px;
    color: var(--text-primary);
    flex: 1;
  }

  .glossary-tip { cursor: help; position: relative; }

  .tip-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-family: var(--font-body);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
    opacity: 0.75;
    border: 1px solid currentColor;
  }

  .glossary-popover {
    position: fixed;
    z-index: 1000;
    max-width: 300px;
    padding: 1rem 1.125rem;
    background: #141414;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    border-top: 3px solid var(--ciiic-lime);
  }

  .glossary-popover--locked {
    pointer-events: auto;
    padding-top: 2.25rem;
    padding-right: 2.25rem;
  }

  .glossary-popover--locked::before {
    content: '';
    position: absolute;
    top: -14px;
    left: -12px;
    right: -12px;
    height: 14px;
  }

  .glossary-popover-close {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 1.5rem;
    height: 1.5rem;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .glossary-popover-close:hover {
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .glossary-popover--locked .glossary-popover-close {
    display: inline-flex;
  }

  .glossary-popover-footer {
    display: none;
    margin-top: 0.875rem;
    padding-top: 0.875rem;
    border-top: 1px solid var(--border-subtle);
  }

  .glossary-popover--locked .glossary-popover-footer {
    display: block;
  }

  .see-entries-btn {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--ciiic-lime);
    color: #000000;
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .see-entries-btn:hover {
    filter: brightness(1.05);
  }

  .see-entries-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .entry.entry-selected {
    background: rgba(200, 230, 65, 0.1);
    outline: 1px solid rgba(200, 230, 65, 0.45);
  }

  .entry { cursor: pointer; }

  .org-panel-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1100;
    background: rgba(0, 0, 0, 0.65);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .org-panel-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .org-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 1200;
    width: min(26rem, 100vw);
    height: 100vh;
    background: #0a0a0a;
    border-left: 1px solid var(--border-subtle);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 32px rgba(0, 0, 0, 0.45);
  }

  .org-panel.is-open {
    transform: translateX(0);
  }

  .org-panel-header {
    padding: 1.25rem 1.25rem 1rem;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }

  .org-panel-header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .org-panel-title {
    font-family: var(--font-heading);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.35;
    color: var(--text-primary);
  }

  .org-panel-close {
    width: 1.75rem;
    height: 1.75rem;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-size: 1.125rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .org-panel-close:hover {
    color: var(--text-primary);
  }

  .org-panel-meta {
    margin-top: 0.5rem;
    font-size: 0.6875rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .org-panel-search {
    padding: 0.875rem 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }

  .org-panel-search input {
    width: 100%;
    padding: 0.625rem 0.75rem;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: #141414;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.8125rem;
  }

  .org-panel-search input::placeholder {
    color: var(--text-muted);
  }

  .org-panel-list {
    overflow-y: auto;
    flex: 1;
    padding: 0.5rem 0;
  }

  .org-panel-empty {
    padding: 2rem 1.25rem;
    text-align: center;
    font-size: 0.8125rem;
    color: var(--text-muted);
  }

  .org-row {
    padding: 0.875rem 1.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .org-row:last-child { border-bottom: none; }

  .org-row-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.35;
  }

  .org-row-meta {
    margin-top: 0.25rem;
    font-size: 0.6875rem;
    color: var(--text-muted);
  }

  .org-row-desc {
    margin-top: 0.375rem;
    font-size: 0.75rem;
    line-height: 1.45;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
  }

  .org-row-link {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--ciiic-lime);
    text-decoration: none;
  }

  .org-row-link:hover {
    text-decoration: underline;
  }

  .glossary-popover-title {
    font-family: var(--font-heading);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .glossary-popover-body {
    font-family: var(--font-body);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
  }

  .glossary-popover-desc { margin-bottom: 0.75rem; color: var(--text-muted); }

  .glossary-popover-status {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 0.75rem;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .glossary-popover-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .glossary-popover-meta {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    font-size: 11px;
    color: var(--text-muted);
  }

  .glossary-popover-meta strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 6px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background 0.15s ease;
  }
  .entry:last-child { border-bottom: none; }
  .entry:hover { background: rgba(255, 255, 255, 0.06); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
    background: #888888;
  }

  .entry-text { flex: 1; }
  .entry-name {
    font-family: var(--font-body);
    font-size: 0.8125rem;
    line-height: 1.45;
    color: var(--text-primary);
    font-weight: 500;
  }
  .entry-count {
    font-family: var(--font-body);
    font-size: 0.625rem;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    padding: 2px 0;
    border-radius: 0;
    white-space: nowrap;
    margin-top: 4px;
    display: inline-block;
  }

  .loading { padding: 3rem; text-align: center; font-size: 13px; color: var(--text-muted); }
  .error {
    padding: 2rem;
    font-size: 13px;
    color: #ff9999;
    background: rgba(163, 45, 45, 0.15);
    border-radius: var(--radius);
    border: 1px solid rgba(163, 45, 45, 0.3);
  }

  footer {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    text-align: center;
  }
  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1.75rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: help;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .footer-note {
    font-family: var(--font-body);
    font-size: 0.6875rem;
    color: var(--text-muted);
  }

  @media (max-width: 768px) {
    body { padding: 1.5rem 0.75rem 2rem; }

    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 1.375rem; letter-spacing: 0.05em; }
    header .subheader { font-size: 0.9375rem; }
    header .intro { font-size: 0.875rem; }

    .layer-band {
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    .layer-grid {
      grid-template-columns: 1fr;
    }

    .vertical-column {
      border-right: none;
      border-bottom: 1px solid var(--border-subtle);
    }
    .vertical-column:last-child { border-bottom: none; }

    .col-head {
      text-align: left;
      justify-content: flex-start;
      padding: 0.75rem 1rem;
      font-size: 0.625rem;
      letter-spacing: 0.08em;
    }

    .cell {
      padding: 0.75rem 1rem;
      min-height: auto;
    }

    .entry-name { font-size: 0.875rem; }

    .legend {
      flex-direction: column;
      align-items: center;
      gap: 0.625rem;
    }

    .glossary-popover {
      max-width: min(300px, calc(100vw - 1.5rem));
    }

    .org-panel {
      width: 100vw;
    }

    .page-meta { gap: 0.5rem; }
    .badge { font-size: 0.625rem; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1 id="page-header">Loading…</h1>
    <p class="subheader" id="page-subheader"></p>
    <p class="intro" id="page-intro"></p>
  </header>

  <div class="matrix" id="matrix">
    <div id="matrix-body"><div class="loading">Loading data…</div></div>
  </div>

  <footer>
    <div class="footer-note" id="footer-note"></div>
  </footer>

  <div class="page-meta">
    <span class="badge" id="layer-count-badge">Loading…</span>
    <span class="badge" id="vertical-count-badge"></span>
    <span class="badge" id="entry-count-badge"></span>
    <span class="badge" id="org-count-badge"></span>
    <span class="badge" id="last-updated"></span>
  </div>

</div>

<script>
const SHEET_ID = '1yYDiayOy2ReCqcbBjUYTi9czT9pLElt5Kuks42WroE0';

const MAIN_LAYER_IDS = ['LID001', 'LID002', 'LID003'];
const VERTICAL_IDS = ['VID001', 'VID002', 'VID003'];

const DEFAULT_LAYER_NAMES = {
  LID001: 'Makers Layer',
  LID002: 'Middle Layer',
  LID003: 'Distribution & Delivery Layer'
};

const DEFAULT_VERTICAL_NAMES = {
  VID001: 'Creative Business Services',
  VID002: 'Media & Entertainment',
  VID003: 'Arts'
};

const VERTICAL_PALETTE = [
  {
    subheader: '#3D6B55',
    cells: ['#2C4A3E', '#1E3329', '#121F18']
  },
  {
    subheader: '#6B6B1A',
    cells: ['#4A4A1A', '#333310', '#1F1F08']
  },
  {
    subheader: '#3D2B5C',
    cells: ['#2A1F3D', '#1C1428', '#0F0B15']
  }
];

const LAYER_BAND_COLORS = ['#1A2B22', '#141E1A', '#0D1210'];

const CIIIC_LIME = '#C8E641';

function verticalTheme(verticalIndex, layerIndex) {
  const vertical = VERTICAL_PALETTE[verticalIndex % VERTICAL_PALETTE.length];
  const cellBg = vertical.cells[layerIndex] ?? vertical.cells[vertical.cells.length - 1];
  return {
    headerBg: vertical.subheader,
    headerColor: '#FFFFFF',
    cellBg
  };
}

function extractColName(label, index) {
  if (label == null || label === '') return `_col${index}`;
  const full = String(label).trim();
  if (/^\S+\s+(LID\d|VID\d|V\dL\dE\d|E\d{3}|[0-9a-f]{6,})/i.test(full)) {
    return full.split(/\s+/)[0];
  }
  return full;
}

async function fetchSheet(tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${tabName}`);
  const text = await res.text();
  const json = JSON.parse(text.substring(47).slice(0, -2));
  const rawRows = json.table.rows.filter(r => r.c && r.c.some(cell => cell && cell.v !== null));

  let cols = json.table.cols.map((c, i) => extractColName(c.label, i));
  let dataRows = rawRows;

  // Header row embedded as first row when gviz returns empty col labels
  if (cols.every(label => label.startsWith('_col')) && rawRows.length > 0) {
    cols = rawRows[0].c.map((cell, i) => {
      const value = (cell && cell.v != null) ? String(cell.v).trim() : '';
      return value || `_col${i}`;
    });
    dataRows = rawRows.slice(1);
  }

  return dataRows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : null; });
    return obj;
  });
}

function looksLikeId(value) {
  return /^(LID|VID|V\dL\dE\d|E\d)/i.test(String(value));
}

function parseMarkerReferences(rows, markerKey, idPattern) {
  const refs = {};
  rows.forEach(row => {
    const id = row[markerKey];
    if (!id || !idPattern.test(String(id))) return;
    const keys = Object.keys(row);
    const idx = keys.indexOf(markerKey);
    if (idx < 0) return;
    const name = row[keys[idx + 1]];
    const desc = row[keys[idx + 2]];
    if (name == null || looksLikeId(name)) return;
    if (!refs[String(id)]) {
      refs[String(id)] = {
        name: String(name),
        description: desc != null ? String(desc) : ''
      };
    }
  });
  return refs;
}

function parseCategorySheet(rows) {
  const layerRefs = parseMarkerReferences(rows, 'Layers (reference)', /^LID\d+$/);
  const verticalRefs = parseMarkerReferences(rows, 'Verticals (reference)', /^VID\d+$/);

  rows.forEach(row => {
    if (row['Layer_ID'] && row['Layer_Name'] && !layerRefs[row['Layer_ID']]) {
      layerRefs[row['Layer_ID']] = { name: String(row['Layer_Name']), description: '' };
    }
    if (row['Vertical_ID'] && row['Vertical_Name'] && !verticalRefs[row['Vertical_ID']]) {
      verticalRefs[row['Vertical_ID']] = { name: String(row['Vertical_Name']), description: '' };
    }
  });

  const layers = MAIN_LAYER_IDS.map(id => ({
    id,
    name: layerRefs[id]?.name || DEFAULT_LAYER_NAMES[id] || id,
    description: layerRefs[id]?.description || ''
  }));

  const verticals = VERTICAL_IDS.map(id => ({
    id,
    name: verticalRefs[id]?.name || DEFAULT_VERTICAL_NAMES[id] || id,
    description: verticalRefs[id]?.description || ''
  }));

  const categories = rows
    .filter(row => row['Category_ID'] && MAIN_LAYER_IDS.includes(row['Layer_ID']))
    .map(row => ({
      id: row['Category_ID'],
      layerId: row['Layer_ID'],
      verticalId: row['Vertical_ID'],
      name: row['Entry'] || '',
      description: row['Description'] || ''
    }));

  return { layers, verticals, categories };
}

function buildOrgCountMap(organizations) {
  const orgCountMap = {};
  organizations.forEach(org => {
      ['Category_ID', 'Category_ID (2)'].forEach(key => {
        const categoryId = org[key];
        if (categoryId) orgCountMap[categoryId] = (orgCountMap[categoryId] || 0) + 1;
      });
    });
  return orgCountMap;
}

function normalizeOrganization(org) {
  const focusParts = ['Focus 1', 'Focus 2', 'Focus 3']
    .map(key => org[key])
    .filter(Boolean)
    .map(value => String(value));

  return {
    id: org['Organization_ID'],
    name: org['Name'] ? String(org['Name']) : '',
    website: org['Website'] ? String(org['Website']) : '',
    city: org['City'] ? String(org['City']) : '',
    focus: focusParts.join(' · ')
  };
}

function buildOrgsByCategory(organizations) {
  const map = {};
  organizations.forEach(org => {
      const normalized = normalizeOrganization(org);
      ['Category_ID', 'Category_ID (2)'].forEach(key => {
        const categoryId = org[key];
        if (!categoryId) return;
        if (!map[categoryId]) map[categoryId] = [];
        if (!map[categoryId].some(item => item.id === normalized.id)) {
          map[categoryId].push(normalized);
        }
      });
    });

  Object.values(map).forEach(list => {
    list.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));
  });

  return map;
}

function parseGlossary(rows) {
  const map = {};
  rows.forEach(row => {
    if (row['Term']) map[row['Term']] = row['Description'] || '';
  });
  return map;
}

function applyPageCopy(glossary) {
  const header = glossary['Header'] || 'Dutch IX industry map';
  const subheader = glossary['Subheader'] || '';
  const intro = glossary['Intro'] || '';
  const version = document.querySelector('meta[name="version"]')?.content || '';

  document.title = header;
  document.getElementById('page-header').textContent = header;
  document.getElementById('page-subheader').textContent = subheader;

  const introEl = document.getElementById('page-intro');
  introEl.textContent = '';
  if (intro) introEl.append(document.createTextNode(intro));
  if (version) {
    const versionSpan = document.createElement('span');
    versionSpan.className = 'intro-version';
    versionSpan.textContent = (intro ? ' · ' : '') + `Version ${version}`;
    introEl.appendChild(versionSpan);
  }
}

let orgsByCategory = {};
let glossaryPopover = null;
let glossaryHideTimer = null;
let glossaryPinned = false;
let entryPopoverLocked = false;
let lockedEntryEl = null;
let activeEntryContext = null;
let orgPanelBackdrop = null;
let orgPanel = null;

function initGlossaryPopover() {
  if (glossaryPopover) return;
  glossaryPopover = document.createElement('div');
  glossaryPopover.id = 'glossary-popover';
  glossaryPopover.className = 'glossary-popover';
  glossaryPopover.hidden = true;
  glossaryPopover.innerHTML = `
    <button type="button" class="glossary-popover-close" aria-label="Close">×</button>
    <div class="glossary-popover-title"></div>
    <div class="glossary-popover-body"></div>
    <div class="glossary-popover-footer">
      <button type="button" class="see-entries-btn">See entries</button>
    </div>
  `;
  document.body.appendChild(glossaryPopover);

  glossaryPopover.addEventListener('mouseenter', () => clearTimeout(glossaryHideTimer));
  glossaryPopover.addEventListener('mouseleave', () => {
    if (!glossaryPinned && !entryPopoverLocked) hideGlossaryPopover();
  });

  glossaryPopover.querySelector('.glossary-popover-close').addEventListener('click', (e) => {
    e.stopPropagation();
    unlockEntryPopover();
  });

  glossaryPopover.querySelector('.see-entries-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!activeEntryContext) return;
    openOrgPanel({
      ...activeEntryContext,
      orgs: orgsByCategory[activeEntryContext.category.id] || []
    });
  });

  document.addEventListener('click', (e) => {
    if (entryPopoverLocked &&
        !e.target.closest('.entry') &&
        !e.target.closest('.glossary-popover') &&
        !e.target.closest('.org-panel') &&
        !e.target.closest('.org-panel-backdrop')) {
      unlockEntryPopover();
    }

    if (glossaryPinned &&
        !e.target.closest('.glossary-tip:not(.entry)') &&
        !e.target.closest('.glossary-popover')) {
      glossaryPinned = false;
      hideGlossaryPopover();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (orgPanel?.classList.contains('is-open')) closeOrgPanel();
      else if (entryPopoverLocked) unlockEntryPopover();
      else if (glossaryPinned) {
        glossaryPinned = false;
        hideGlossaryPopover();
      }
    }
  });
}

function initOrgPanel() {
  if (orgPanel) return;

  orgPanelBackdrop = document.createElement('div');
  orgPanelBackdrop.className = 'org-panel-backdrop';
  orgPanelBackdrop.addEventListener('click', closeOrgPanel);

  orgPanel = document.createElement('aside');
  orgPanel.className = 'org-panel';
  orgPanel.setAttribute('aria-hidden', 'true');
  orgPanel.innerHTML = `
    <div class="org-panel-header">
      <div class="org-panel-header-top">
        <h2 class="org-panel-title"></h2>
        <button type="button" class="org-panel-close" aria-label="Close">×</button>
      </div>
      <div class="org-panel-meta"></div>
    </div>
    <div class="org-panel-search">
      <input type="search" placeholder="Search organisations…" aria-label="Search organisations">
    </div>
    <div class="org-panel-list"></div>
  `;

  orgPanel.querySelector('.org-panel-close').addEventListener('click', closeOrgPanel);
  orgPanel.querySelector('.org-panel-search input').addEventListener('input', (e) => {
    filterOrgPanelList(e.target.value);
  });

  document.body.appendChild(orgPanelBackdrop);
  document.body.appendChild(orgPanel);
}

let orgPanelItems = [];

function formatWebsite(url) {
  return String(url).replace(/^https?:\/\//i, '').replace(/\/$/, '');
}

function renderOrgPanelList(items) {
  const list = orgPanel.querySelector('.org-panel-list');
  list.innerHTML = '';

  if (items.length === 0) {
    list.innerHTML = '<div class="org-panel-empty">No organisations in this category.</div>';
    return;
  }

  items.forEach(org => {
    const row = document.createElement('article');
    row.className = 'org-row';

    const name = document.createElement('div');
    name.className = 'org-row-name';
    name.textContent = org.name || 'Unnamed organisation';
    row.appendChild(name);

    const metaParts = [org.city, org.focus].filter(Boolean);
    if (metaParts.length > 0) {
      const meta = document.createElement('div');
      meta.className = 'org-row-meta';
      meta.textContent = metaParts.join(' · ');
      row.appendChild(meta);
    }

    if (org.website) {
      const link = document.createElement('a');
      link.className = 'org-row-link';
      link.href = org.website.startsWith('http') ? org.website : `https://${org.website}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = formatWebsite(org.website);
      row.appendChild(link);
    }

    list.appendChild(row);
  });
}

function filterOrgPanelList(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    renderOrgPanelList(orgPanelItems);
    return;
  }

  const filtered = orgPanelItems.filter(org => {
    const haystack = [org.name, org.city, org.focus, org.website]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    return haystack.includes(q);
  });

  renderOrgPanelList(filtered);
}

function openOrgPanel(context) {
  initOrgPanel();
  unlockEntryPopover();

  const { category, layer, vertical, count, orgs } = context;
  orgPanelItems = orgs || [];

  orgPanel.querySelector('.org-panel-title').textContent = (category.name || '').replace(/\*+$/, '').trim();
  orgPanel.querySelector('.org-panel-meta').textContent =
    `${layer.name} · ${vertical.name} · ${formatRecordCount(count)}`;

  const searchInput = orgPanel.querySelector('.org-panel-search input');
  searchInput.value = '';
  orgPanel.querySelector('.org-panel-search').hidden = orgPanelItems.length <= 8;

  renderOrgPanelList(orgPanelItems);

  orgPanelBackdrop.classList.add('is-open');
  orgPanel.classList.add('is-open');
  orgPanel.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  searchInput.focus();
}

function closeOrgPanel() {
  if (!orgPanel) return;
  orgPanelBackdrop.classList.remove('is-open');
  orgPanel.classList.remove('is-open');
  orgPanel.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function resolveGlossaryText(glossary, keys, fallback) {
  for (const key of keys) {
    if (glossary[key]) return { term: key, text: glossary[key] };
  }
  if (fallback) return { term: keys[0] || 'Info', text: fallback };
  return null;
}

function positionGlossaryPopover(el, options = {}) {
  const locked = Boolean(options.locked);
  const rect = el.getBoundingClientRect();
  const pop = glossaryPopover;
  pop.hidden = false;
  const margin = 10;
  const gap = locked ? 0 : 2;
  const overlap = locked ? 8 : 0;
  let top = rect.bottom + gap - overlap;
  let left = rect.left + rect.width / 2 - pop.offsetWidth / 2;

  if (left + pop.offsetWidth > window.innerWidth - margin) {
    left = window.innerWidth - pop.offsetWidth - margin;
  }
  if (left < margin) left = margin;

  if (top + pop.offsetHeight > window.innerHeight - margin) {
    top = rect.top - pop.offsetHeight - gap + overlap;
  }

  pop.style.top = `${top}px`;
  pop.style.left = `${left}px`;
}

function showGlossaryPopover(el, term, text) {
  if (!text) return;
  clearTimeout(glossaryHideTimer);
  initGlossaryPopover();
  glossaryPopover.querySelector('.glossary-popover-title').textContent = term;
  glossaryPopover.querySelector('.glossary-popover-body').textContent = text;
  glossaryPopover.hidden = false;
  positionGlossaryPopover(el);
}

function formatRecordCount(count) {
  return `${count} Record${count !== 1 ? 's' : ''}`;
}

function showEntryPopover(el, category, layer, vertical, count, locked) {
  clearTimeout(glossaryHideTimer);
  initGlossaryPopover();

  activeEntryContext = { category, layer, vertical, count, anchorEl: el };

  const title = (category.name || '').replace(/\*+$/, '').trim();
  glossaryPopover.querySelector('.glossary-popover-title').textContent = title;

  const body = glossaryPopover.querySelector('.glossary-popover-body');
  body.innerHTML = '';

  if (category.description) {
    const desc = document.createElement('p');
    desc.className = 'glossary-popover-desc';
    desc.textContent = category.description;
    body.appendChild(desc);
  }

  const meta = document.createElement('div');
  meta.className = 'glossary-popover-meta';

  const verticalLine = document.createElement('div');
  verticalLine.innerHTML = '<strong>Vertical:</strong> ';
  verticalLine.append(document.createTextNode(vertical.name));

  const layerLine = document.createElement('div');
  layerLine.innerHTML = '<strong>Layer:</strong> ';
  layerLine.append(document.createTextNode(layer.name));

  const recordsLine = document.createElement('div');
  recordsLine.textContent = formatRecordCount(count);

  meta.append(verticalLine, layerLine, recordsLine);
  body.appendChild(meta);

  const seeEntriesBtn = glossaryPopover.querySelector('.see-entries-btn');
  seeEntriesBtn.textContent = count === 0 ? 'No entries' : `See ${count} entr${count === 1 ? 'y' : 'ies'}`;
  seeEntriesBtn.disabled = count === 0;

  glossaryPopover.classList.toggle('glossary-popover--locked', locked);
  glossaryPopover.hidden = false;
  positionGlossaryPopover(el, { locked });
}

function unlockEntryPopover() {
  entryPopoverLocked = false;
  activeEntryContext = null;
  if (lockedEntryEl) {
    lockedEntryEl.classList.remove('entry-selected');
    lockedEntryEl = null;
  }
  if (glossaryPopover) {
    glossaryPopover.classList.remove('glossary-popover--locked');
  }
  hideGlossaryPopover();
}

function lockEntryPopover(el, category, layer, vertical, count) {
  if (lockedEntryEl && lockedEntryEl !== el) {
    lockedEntryEl.classList.remove('entry-selected');
  }

  entryPopoverLocked = true;
  lockedEntryEl = el;
  el.classList.add('entry-selected');
  showEntryPopover(el, category, layer, vertical, count, true);
}

function hideGlossaryPopover() {
  clearTimeout(glossaryHideTimer);
  if (entryPopoverLocked) return;
  if (glossaryPopover) glossaryPopover.hidden = true;
}

function scheduleHideGlossaryPopover() {
  clearTimeout(glossaryHideTimer);
  if (!glossaryPinned && !entryPopoverLocked) {
    glossaryHideTimer = setTimeout(hideGlossaryPopover, 250);
  }
}

function attachPopoverTip(el, open) {
  el.classList.add('glossary-tip');
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-describedby', 'glossary-popover');

  const pin = (e) => {
    e.stopPropagation();
    glossaryPinned = !glossaryPinned;
    if (glossaryPinned) open();
    else hideGlossaryPopover();
  };

  el.addEventListener('mouseenter', open);
  el.addEventListener('mouseleave', scheduleHideGlossaryPopover);
  el.addEventListener('focus', open);
  el.addEventListener('blur', scheduleHideGlossaryPopover);
  el.addEventListener('click', pin);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      pin(e);
    }
  });
}

function attachGlossaryTip(el, glossary, keys, fallback, showIcon) {
  const resolved = resolveGlossaryText(glossary, keys, fallback);
  if (!resolved || !resolved.text) return;

  if (showIcon) {
    const icon = document.createElement('span');
    icon.className = 'tip-icon';
    icon.textContent = '?';
    icon.setAttribute('aria-hidden', 'true');
    el.appendChild(icon);
  }

  attachPopoverTip(el, () => showGlossaryPopover(el, resolved.term, resolved.text));
}

function attachEntryTip(el, category, layer, vertical, count) {
  el.classList.add('glossary-tip');
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');

  const openPreview = () => {
    if (entryPopoverLocked) return;
    showEntryPopover(el, category, layer, vertical, count, false);
  };

  const lock = (e) => {
    e.preventDefault();
    e.stopPropagation();
    lockEntryPopover(el, category, layer, vertical, count);
  };

  el.addEventListener('mouseenter', openPreview);
  el.addEventListener('mouseleave', scheduleHideGlossaryPopover);
  el.addEventListener('focus', openPreview);
  el.addEventListener('blur', scheduleHideGlossaryPopover);
  el.addEventListener('click', lock);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      lock(e);
    }
  });
}

function attachSheetTip(el, title, description, showIcon) {
  if (!description) return;

  if (showIcon) {
    const icon = document.createElement('span');
    icon.className = 'tip-icon';
    icon.textContent = '?';
    icon.setAttribute('aria-hidden', 'true');
    el.appendChild(icon);
  }

  attachPopoverTip(el, () => showGlossaryPopover(el, title, description));
}

function attachLayerTip(el, layer, showIcon) {
  attachSheetTip(el, layer.name, layer.description, showIcon);
}

function attachVerticalTip(el, vertical, showIcon) {
  attachSheetTip(el, `Vertical: ${vertical.name}`, vertical.description, showIcon);
}

function renderFooterNote(glossary) {
  const footerNote = document.getElementById('footer-note');
  if (!footerNote) return;
  footerNote.innerHTML = '';

  const star = document.createElement('span');
  star.textContent = '*';
  if (glossary['* (asterisk on entry)']) {
    attachGlossaryTip(star, glossary, ['* (asterisk on entry)'], glossary['* (asterisk on entry)'], false);
  }
  footerNote.appendChild(star);
  footerNote.append(' active across multiple verticals \u00a0·\u00a0 ');

  const copyright = document.createElement('span');
  copyright.textContent = glossary['Copyright'] || '';
  footerNote.appendChild(copyright);
}

function renderMatrix(layers, verticals, categories, orgCountMap, glossary) {
  const body = document.getElementById('matrix-body');
  body.innerHTML = '';

  layers.forEach((layer, layerIndex) => {
    const block = document.createElement('div');
    block.className = 'layer-block';

    const band = document.createElement('div');
    band.className = 'layer-band';
    band.style.background = LAYER_BAND_COLORS[layerIndex] ?? LAYER_BAND_COLORS[LAYER_BAND_COLORS.length - 1];
    band.style.color = '#FFFFFF';
    band.appendChild(document.createTextNode(layer.name));
    attachLayerTip(band, layer, true);
    block.appendChild(band);

    const layerGrid = document.createElement('div');
    layerGrid.className = 'layer-grid';

    verticals.forEach((vertical, verticalIndex) => {
      const theme = verticalTheme(verticalIndex, layerIndex);
      const column = document.createElement('div');
      column.className = 'vertical-column';

      const col = document.createElement('div');
      col.className = 'col-head';
      col.style.background = theme.headerBg;
      col.style.color = theme.headerColor;
      col.appendChild(document.createTextNode(vertical.name));
      attachVerticalTip(col, vertical, true);
      column.appendChild(col);

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = theme.cellBg;

      const cellCategories = categories.filter(
        category => category.layerId === layer.id && category.verticalId === vertical.id
      );

      cellCategories.forEach(category => {
        const count = orgCountMap[category.id] || 0;

        const el = document.createElement('div');
        el.className = 'entry';

        const text = document.createElement('div');
        text.className = 'entry-text';

        const name = document.createElement('div');
        name.className = 'entry-name';
        name.textContent = category.name;

        const countBadge = document.createElement('div');
        countBadge.className = 'entry-count';
        countBadge.textContent = count === 0 ? '0 records' : `${count} record${count > 1 ? 's' : ''}`;

        text.appendChild(name);
        text.appendChild(countBadge);
        el.appendChild(text);
        attachEntryTip(el, category, layer, vertical, count);

        cell.appendChild(el);
      });

      if (cellCategories.length === 0) {
        cell.innerHTML = '<span style="font-size:11px;color:rgba(255,255,255,0.2);">—</span>';
      }

      column.appendChild(cell);
      layerGrid.appendChild(column);
    });

    block.appendChild(layerGrid);
    body.appendChild(block);
  });
}

async function init() {
  try {
    const [categoryRaw, organizationsRaw, glossaryRaw] = await Promise.all([
      fetchSheet('NEW Category'),
      fetchSheet('NEW Organizations'),
      fetchSheet('Glossary')
    ]);

    const glossary = parseGlossary(glossaryRaw);
    applyPageCopy(glossary);
    initGlossaryPopover();

    const { layers, verticals, categories } = parseCategorySheet(categoryRaw);
    orgsByCategory = buildOrgsByCategory(organizationsRaw);
    const orgCountMap = buildOrgCountMap(organizationsRaw);

    document.documentElement.style.setProperty('--vertical-count', verticals.length);

    document.getElementById('layer-count-badge').textContent = `${layers.length} layer${layers.length !== 1 ? 's' : ''}`;
    document.getElementById('vertical-count-badge').textContent = `${verticals.length} vertical${verticals.length !== 1 ? 's' : ''}`;
    document.getElementById('entry-count-badge').textContent = `${categories.length} categor${categories.length !== 1 ? 'ies' : 'y'}`;
    const totalOrgs = new Set(organizationsRaw.map(org => org['Organization_ID']).filter(Boolean)).size;
    document.getElementById('org-count-badge').textContent = `${totalOrgs} organisation${totalOrgs !== 1 ? 's' : ''}`;
    document.getElementById('last-updated').textContent = `Updated ${new Date().toLocaleDateString('en-NL', { day: 'numeric', month: 'short', year: 'numeric' })}`;

    renderFooterNote(glossary);
    renderMatrix(layers, verticals, categories, orgCountMap, glossary);

  } catch (e) {
    document.getElementById('matrix-body').innerHTML = `<div class="error">Could not load data. Make sure the Google Sheet is publicly readable (Share → Anyone with the link → Viewer).<br><br>Error: ${e.message}</div>`;
    console.error(e);
  }
}

init();
</script>
